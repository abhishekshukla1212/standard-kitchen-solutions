<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/jpeg" href="/logo.jpeg?v=2" />

    <title>Standard Kitchen Solutions</title>

    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body style="margin: 0; background-color: #0f172a;">
    <div id="root">
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;background-color:#0f172a;flex-direction:column;gap:20px;">
        <div style="width:50px;height:50px;border:4px solid rgba(255,255,255,0.1);border-top:4px solid #ffffff;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="color:white;font-family:sans-serif;letter-spacing:2px;font-size:14px;text-transform:uppercase;">Loading...</div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
